services:
  postgres:
    image: postgres:16-alpine
    container_name: houston-iv-postgres
    environment:
      POSTGRES_USER: houston
      POSTGRES_PASSWORD: houston123
      POSTGRES_DB: houston_iv
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houston -d houston_iv"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
