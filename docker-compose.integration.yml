services:
  postgres:
    image: postgres:16-alpine
    container_name: houston-integration-postgres
    environment:
      POSTGRES_USER: houston
      POSTGRES_PASSWORD: houston123
      POSTGRES_DB: houston_integration
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houston -d houston_integration"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: houston-integration-api
    environment:
      DATABASE_URL: postgresql://houston:houston123@postgres:5432/houston_integration
      NODE_ENV: test
      BETTER_AUTH_SECRET: test-secret-key-for-integration-tests
      BETTER_AUTH_URL: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: houston-integration-web
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api
      NODE_ENV: test
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
