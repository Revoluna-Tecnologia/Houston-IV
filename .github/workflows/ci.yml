name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        if: matrix.app == 'api'
        run: pnpm --filter @houston/api exec prisma generate

      - name: Lint
        run: pnpm --filter @houston/${{ matrix.app }} lint

      - name: Build
        run: pnpm --filter @houston/${{ matrix.app }} build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: ci-test-secret-key-min-32-chars-long
          BETTER_AUTH_URL: http://localhost:3001
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

      - name: Test
        run: pnpm --filter @houston/${{ matrix.app }} test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          BETTER_AUTH_SECRET: ci-test-secret-key-min-32-chars-long
          BETTER_AUTH_URL: http://localhost:3001
